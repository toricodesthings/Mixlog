# Mixlog CI — health signal on every PR and push to main (deploys are by hand; this gates nothing).
# One install, one step per concern: the red step's name says what broke. Later steps still run after a failure.

name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install
        id: install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm typecheck

      - name: Test
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm test

      - name: Build
        id: build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm build

      - name: Deploy dry-run
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: pnpm exec wrangler deploy --dry-run

  security:
    name: Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      # docs/ is local only (AGENTS.md); it must never reach GitHub.
      - name: Block tracked secret files and docs
        run: |
          tracked=$(
            git ls-files \
              | grep -E '(^|/)(\.env($|\.)|\.dev\.vars($|\.)|.*\.(pem|key|crt)$)|^docs/' \
              | grep -Ev '(^|/)\.(env|dev\.vars)(\.[^/]+)?\.(example|sample|template)$' \
              || true
          )
          if [ -n "${tracked}" ]; then
            printf '::error::Tracked secret-like or local-only files detected:\n%s\n' "${tracked}" >&2
            exit 1
          fi

      - name: Block embedded private keys and hardcoded tokens
        if: ${{ !cancelled() }}
        run: |
          if git grep -nE -- '-----BEGIN ([A-Z ]+ )?PRIVATE KEY-----' -- .; then
            echo "::error::Embedded private key material found in tracked files." >&2
            exit 1
          fi
          if git grep -nEi \
            -- '(sk_live_|sk_test_|AKIA[A-Z0-9]{16}|ghp_[a-zA-Z0-9]{36}|github_pat_[a-zA-Z0-9_]{40,}|xox[bsapr]-[a-zA-Z0-9-]+|CLOUDFLARE_API_TOKEN *[=:] *["'\'']?[A-Za-z0-9_-]{30,})' \
            -- . ':!pnpm-lock.yaml' ':!*.md' ':!.github/workflows/*.yml'; then
            echo "::error::Potential hardcoded secret or API key detected." >&2
            exit 1
          fi

      # Reads the lockfile only; no install needed.
      - name: Audit production dependencies
        if: ${{ !cancelled() }}
        run: pnpm audit --prod --audit-level=high
